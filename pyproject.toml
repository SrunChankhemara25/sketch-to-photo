[project]
name = "sketch2photo-studio"
version = "1.0.0"
description = "Local bidirectional photo and pencil image translation demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "Pillow",
  "streamlit==1.65.0",
  "torch",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
